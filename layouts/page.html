{{ define "main" }}
  {{ if eq .Section "posts" }}
    <nav aria-label="مسیر صفحه">
      <a href="{{ .Site.Home.RelPermalink }}">خانه</a>
      <span aria-hidden="true">/</span>
      <a href="{{ "posts/" | relURL }}">مقالات</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">{{ .Title }}</span>
    </nav>
  {{ end }}

  <article>
    <header>
      <h1>{{ .Title }}</h1>

      {{ with .Date }}
        <p>
          <time datetime="{{ .Format "2006-01-02T15:04:05Z07:00" }}">
            {{ .Format "2006/01/02" }}
          </time>
        </p>
      {{ end }}

      {{ with .Params.author }}
        <p>نویسنده: {{ . }}</p>
      {{ end }}
    </header>

    {{ .Content }}
  </article>
{{ end }}
