media:
  - name: images
    label: تصاویر
    input: static/media/posts
    output: /media/posts
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe

content:

  - name: posts
    label: مطالب
    type: group

    items:

      - name: poems
        label: اشعار
        type: collection
        path: content/poems
        format: yaml-frontmatter
        subfolders: true
        exclude:
          - "_index.md"
        filename: "{fields.slug}/index.md"

        view:
          layout: list
          primary: title
          fields:
            - title
            - date
            - categories
            - tags
          sort:
            - date
          default:
            sort: date
            order: desc
          search:
            - title
            - description
            - tags

        fields:

          - name: title
            label: عنوان
            type: string
            required: true
            options:
              maxlength: 120

          - name: contentType
            label: نوع مطلب
            type: select
            required: true
            options:
              values:
                - name: poems
                  label: شعر

          - name: font
            label: فونت مطلب
            type: select
            required: true
            options:
              values:
                - name: vazirmatn
                  label: وزیرمتن
                - name: estedad
                  label: استعداد
                - name: sahel
                  label: ساحل

          - name: textSize
            label: اندازه متن
            type: select
            required: true
            options:
              values:
                - name: normal
                  label: معمولی
                - name: large
                  label: بزرگ
                - name: xlarge
                  label: خیلی بزرگ

          - name: textAlign
            label: تراز متن
            type: select
            options:
              values:
                - name: right
                  label: راست‌چین
                - name: left
                  label: چپ‌چین
                - name: justify
                  label: جاستیفای

          - name: slug
            label: نامک URL
            type: string
            required: true
            description: "برای URL از حروف انگلیسی کوچک، عدد و خط تیره استفاده کن."
            options:
              minlength: 3
              maxlength: 80

          - name: description
            label: توضیحات SEO
            type: text
            required: true
            options:
              maxlength: 160

          - name: summary
            label: خلاصه
            type: text
            options:
              maxlength: 280

          - name: date
            label: تاریخ انتشار
            type: date
            required: true
            options:
              time: true
              format: "yyyy-MM-dd'T'HH:mm:ss"

          - name: lastmod
            label: تاریخ آخرین ویرایش
            type: date
            options:
              time: true
              format: "yyyy-MM-dd'T'HH:mm:ss"

          - name: author
            label: نویسنده
            type: string
            required: true
            default: "محمد علی‌نوری"

          - name: categories
            label: دسته‌بندی‌ها
            type: string
            list: true

          - name: tags
            label: برچسب‌ها
            type: string
            list: true

          - name: cover
            label: تصویر کاور
            type: image
            options:
              media: images
              path: media/posts
              extensions:
                - jpg
                - jpeg
                - png
                - webp
                - avif
              rename: safe

          - name: cover_alt
            label: متن جایگزین تصویر کاور
            type: string
            description: "توضیح کوتاه و دقیق برای تصویر؛ برای دسترسی‌پذیری و SEO."
            options:
              maxlength: 160

          - name: body
            label: متن نوشته
            type: rich-text
            options:
              format: markdown
              media: images
              path: media/posts
              extensions:
                - jpg
                - jpeg
                - png
                - webp
                - avif
              rename: safe
              switcher: true


