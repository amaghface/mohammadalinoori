  - name: about
    label: درباره من
    type: file
    path: content/about.md
    format: yaml-frontmatter

    operations:
      delete: false

    fields:

      - name: title
        label: عنوان
        type: string
        required: true
        options:
          maxlength: 120

      - name: description
        label: توضیحات SEO
        type: text
        required: true
        options:
          maxlength: 160

      - name: image
        label: تصویر محمد علی‌نوری
        type: image
        options:
          media: images
          path: media/posts
          extensions:
            - jpg
            - jpeg
            - png
            - webp
            - avif
          rename: safe

      - name: image_alt
        label: متن جایگزین تصویر
